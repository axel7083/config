# yaml-language-server: $schema=https://raw.githubusercontent.com/open-macaron/macaron/main/packages/contracts/schemas/config-org.schema.json
#
# axel7083, a user account: the sandbox upstream, and the test fork of Podman Desktop.

org: axel7083
id: 42176370
owners: "@open-macaron/maintainers"
bots: []
concurrency: 1
repos:
  # Sandbox upstream for end-to-end tests: a Podman Desktop extension template.
  foobar-tmp-demo:
    knowledge: sandbox
    budgets:
      implement: 2.00
      address_review: 1.50
    commands:
      build: npm run build

  # Test fork of podman-desktop/podman-desktop, to try the bot on Podman Desktop itself (building
  # and running the application, reproducing, verifying) before it comments on the real project. It
  # shares the bot's fork with the upstream: GitHub allows one fork per network, and pull requests
  # from it can target any repository of the network. Issue numbers here start at 1, far below
  # upstream's, so the bot's branch names don't collide.
  podman-desktop:
    knowledge: podman-desktop
    runsOn: ubuntu-26.04
    timeoutMinutes: 75
    environment:
      source: shared
      name: podman-desktop
      params:
        machine: "true"
    # `@macaron-bot reproduce on windows`: the same environment, with Podman and its WSL machine
    # from redhat-actions/podman-install.
    platforms:
      windows:
        runsOn: windows-2025
    budgets:
      plan: 1.00
      implement: 5.00
      address_review: 2.00
      reproduce: 4.00
      verify: 4.00
    commands:
      build: pnpm build
      test: pnpm test:unit
      lint: pnpm lint:check
    contribution:
      dco: true
